site_name: Arquitectura de Computadoras — Final
site_description: Sitio de estudio para el final de Arquitectura de Computadoras (UNLP)
site_author: Maxi
docs_dir: docs
site_dir: site

# Ajustar al publicar en GitHub Pages: https://<usuario>.github.io/<repo>/
site_url: ""
use_directory_urls: true

theme:
  name: material
  language: es
  features:
    # Navegación por tabs, colapsable y pegada al scroll
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    # Búsqueda
    - search.highlight
    - search.share
    - search.suggest
    # Lectura
    - content.code.copy
    - content.tooltips
  palette:
    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/mobile.css
  - assets/stylesheets/practica.css

extra_javascript:
  # Widgets de práctica: JS plano, sin dependencias ni build.
  - assets/javascripts/practica.js

plugins:
  - search:
      lang: es
      separator: '[\s\-\.\_]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  # Sin esto, los iconos :material-xxx: de las tarjetas y los botones se
  # imprimen como texto literal en vez de renderizarse como SVG.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/

