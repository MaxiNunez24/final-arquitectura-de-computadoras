      - Memoria caché: temas/memoria-cache.md
      - Segmentación de cauce: temas/segmentacion.md
      - Soluciones a la segmentación: temas/soluciones-segmentacion.md
      - RISC vs CISC: temas/risc-cisc.md
      - Superescalares: temas/superescalares.md
      - Paralelismo: temas/paralelismo.md
      - Buses: temas/buses.md
      - Von Neumann y pila: temas/von-neumann-y-pila.md
