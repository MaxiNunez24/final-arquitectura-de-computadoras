# =============================================================================
# BANCO DE PREGUNTAS DE FINALES — Arquitectura de Computadoras (UNLP)
# =============================================================================
# Extracción textual de los archivos de finales en ./fuentes/Finales/.
# Los enunciados se transcriben tal como figuran en la fuente, incluyendo
# erratas de tipeo del original (se marcan con [sic] sólo cuando podrían
# confundir al leer).
#
# Este archivo es la fuente de verdad: las páginas de docs/finales/ se
# generan desde acá con scripts/gen_banco.py. No editar el markdown a mano.
# =============================================================================

meta:
  materia: Arquitectura de Computadoras
  facultad: UNLP
  descripcion: >-
    Preguntas extraídas de finales viejos, agrupadas por tema. Cada pregunta
    canónica agrupa sus variantes de redacción, que en las fuentes aparecen
    casi textuales entre distintas fechas.

  # --- Notas sobre las fuentes, verificadas con sha256 y análisis de texto ---
  notas_fuentes:
    - archivo: "Finales/Arquitectura_finales_parte1.pdf"
      nota: >-
        Byte a byte idéntico a "Finales/SF - AC Final - 40.pdf"
        (sha256 19927200f28e…). Se cita una sola vez.
    - archivo: "Finales/Finales arq Alfonso _resueltos.docx"
      nota: >-
        Contenido prácticamente idéntico a
        "Finales/Preguntas del Final Arquitectura Hasta 2014.pdf"
        (coeficiente de Jaccard 0,991 sobre el vocabulario). Se cita la
        versión PDF, que es la que conserva el formato de las fechas.
    - archivo: "Finales/2015 - AC Final - 01.pdf"
      nota: >-
        PDF de una sola página que contiene únicamente una imagen escaneada
        (CCITT, 1656x2339, sin capa de texto). No se pudo extraer el
        enunciado. PENDIENTE DE TRANSCRIPCIÓN MANUAL.
      estado: no_extraido
    - archivo: "Finales/Finales 2010.docx"
      nota: >-
        Pese al nombre, no contiene finales completos: es un único desarrollo
        respondido sobre buses, con 6 imágenes embebidas provenientes del
        Anexo de la clase 07.

  # Las fuentes que traen respuesta desarrollada, en orden de confiabilidad
  # declarada por el propio autor del apunte.
  fuentes_con_respuesta:
    - "Finales/Preguntas del Final Arquitectura Hasta 2014.pdf"
    - "Finales/Karim - Preguntas de Finales.pdf"
    - "Finales/Preguntas FINALES con Respuestas.docx.pdf"
    - "Finales/Finales 2010.docx"

temas:
  interrupciones: Interrupciones
  entrada-salida: Entrada/Salida
  dma: DMA — Acceso Directo a Memoria
  memoria-cache: Memoria caché
  segmentacion: Segmentación de cauce
  soluciones-segmentacion: Soluciones a los riesgos de segmentación
  risc-cisc: RISC vs CISC
  superescalares: Procesadores superescalares
  paralelismo: Procesamiento paralelo
  buses: Buses
  von-neumann-y-pila: Von Neumann y pila

