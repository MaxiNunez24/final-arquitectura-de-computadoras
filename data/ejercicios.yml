    correcta: 0
    opciones: [{svg: von-neumann}, {svg: buses-jerarquia}, {svg: modulo-es}]
    explicacion: "CPU, memoria y E/S sobre los tres buses. El segundo es la jerarquía de buses y el tercero es el interior de un módulo de E/S."
