# =============================================================================
# EJERCICIOS INTERACTIVOS — Arquitectura de Computadoras (UNLP)
# =============================================================================
# Alimenta docs/practica/quiz.md, afirmaciones.md y diagramas.md.
#
# -----------------------------------------------------------------------------
# CÓMO SE ARMA UN ÍTEM SIN VIOLAR LA REGLA NÚMERO UNO
# -----------------------------------------------------------------------------
# Un distractor inventado es contenido inventado, y es peor que en una ficha
# porque se lee como si fuera un error YA VERIFICADO. Entonces:
#
#   ✅ PERMITIDO — recombinar la fuente. El distractor es una afirmación que la
#      teoría hace, puesta donde no corresponde: la definición de la
#      correspondencia asociativa ofrecida como respuesta sobre la directa, el
#      registro ISR ofrecido donde va el IRR, la ventaja de write-through
#      atribuida a write-back. Todo el material del ítem existe en las fuentes;
#      lo único que se arma es el cruce.
#
#   ❌ PROHIBIDO — fabricar. Números que la cátedra no dio, mecanismos que no
#      describió, "consecuencias lógicas" deducidas por criterio propio.
#
# Por eso NO hay ejercicios de cálculo salvo donde la teoría desarrolla el
# cálculo (tiempo de acceso medio de caché). Ver docs/todos.md.
#
# `fuente` es la misma cita que lleva la sección de la ficha de la que sale el
# ítem. `explicacion` de cada opción también sale de la ficha.
#
# tipo: multiple → "elegí la correcta"      (correctas puede tener 1 o varios)
# tipo: falsa    → "elegí la FALSA"         (la correcta es la afirmación falsa)
# =============================================================================

opciones:

  # =========================== INTERRUPCIONES ================================

  - id: OP-INT-01
    tema: interrupciones
    tipo: multiple
    consigna: "Al atender una interrupción, ¿qué salva la CPU como mínimo?"
    correctas: [0]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 6–7."
    opciones:
      - texto: "El Contador de Programa (PC) y el registro de estado (PSW), típicamente en la pila del sistema."
        explicacion: "Correcto. La teoría dice «al menos salva el PC y el PSW». Los necesita para restaurar la tarea suspendida."
      - texto: "Todos los registros del procesador, sin excepción."
        explicacion: "Es una de las 2 estrategias de guardado posibles, pero no el mínimo. La otra es guardar sólo la próxima instrucción y algún registro crítico."
      - texto: "El vector de la interrupción que le proveyó el PIC."
        explicacion: "El vector no se salva: se usa para obtener la dirección del servicio y cargar el PC con ese valor."
      - texto: "El contenido de la memoria caché asociado a la tarea suspendida."
        explicacion: "La teoría no menciona nada de la caché en el salvado de estado de una interrupción."

  - id: OP-INT-02
    tema: interrupciones
    tipo: multiple
    consigna: "¿Dónde busca la CPU la dirección de comienzo del servicio de la interrupción?"
    correctas: [0]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 8–20."
    opciones:
      - texto: "En un área de memoria reservada llamada área de vectores de interrupción, que tiene una dirección por cada interrupción."
        explicacion: "Correcto. Obtiene la dirección de esa área y carga el PC con ese valor, bifurcando al servicio."
      - texto: "En la propia instrucción que provocó la interrupción, como en un llamado a subrutina."
        explicacion: "Así funciona el llamado a subrutina, no la interrupción. Es justamente una de las diferencias entre ambos."
      - texto: "En la pila del sistema, junto al PC y el PSW que acaba de apilar."
        explicacion: "En la pila se salva el estado a restaurar, no la dirección del servicio."
      - texto: "En el registro IMR del controlador programable de interrupciones."
        explicacion: "El IMR sirve para habilitar/deshabilitar pedidos. Los vectores están en los registros INT0…INT7 del PIC, y el área de vectores está en memoria."

  - id: OP-INT-03
    tema: interrupciones
    tipo: multiple
    consigna: "En el PIC, ¿cuál es el registro que contiene los pedidos de interrupción provenientes de los periféricos?"
    correctas: [1]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 43."
    opciones:
      - texto: "ISR"
        explicacion: "El ISR identifica la interrupción EN SERVICIO, no los pedidos."
      - texto: "IRR"
        explicacion: "Correcto. El IRR contiene los pedidos provenientes de los periféricos, e indica con bit en 1."
      - texto: "IMR"
        explicacion: "El IMR se usa para habilitar/deshabilitar los pedidos: es el enmascaramiento, y enmascara con 1."
      - texto: "INT0…INT7"
        explicacion: "Esos registros guardan el vector de cada interrupción."

  - id: OP-INT-04
    tema: interrupciones
    tipo: multiple
    consigna: "Con varias interrupciones de IGUAL prioridad: llega un pedido nuevo mientras se está ejecutando el servicio de otra. ¿Qué pasa?"
    correctas: [2]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 21–31."
    opciones:
      - texto: "Interrumpe al servicio en curso, porque toda interrupción tiene prioridad sobre el código que se está ejecutando."
        explicacion: "Eso pasa sólo cuando la que llega es de MAYOR prioridad. Con igual prioridad, no."
      - texto: "Se descarta, porque al atender una interrupción se inhabilitan las demás."
        explicacion: "Se inhabilitan, sí, pero no se descarta: queda pendiente y se atiende después."
      - texto: "Queda pendiente, y se atiende cuando termina el servicio en curso y se habilitan nuevamente las interrupciones."
        explicacion: "Correcto. Con igual prioridad se procesan en el orden en que llegan: al atender una se inhabilita el resto de igual o menor nivel, y la nueva espera."
      - texto: "Se atiende en paralelo, porque el PIC puede administrar varios servicios simultáneos."
        explicacion: "El PIC administra prioridades y genera vectores, no ejecuta servicios en paralelo."

  - id: OP-INT-05
    tema: interrupciones
    tipo: multiple
    consigna: "En el diálogo entre el PIC y la CPU, ¿qué señal usa la CPU para avisar que está lista para atender la interrupción?"
    correctas: [1]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 32–36."
    opciones:
      - texto: "IntR (interrupt request)"
        explicacion: "IntR va en el otro sentido: es la única señal con la que el PIC le solicita atención a la CPU."
      - texto: "IntA (interrupt acknowledge)"
        explicacion: "Correcto. Con IntA la CPU le avisa al PIC que está lista, y recién ahí el PIC pone el vector en el bus de datos."
      - texto: "EOI (end of interrupt)"
        explicacion: "El EOI se usa al terminar el servicio, no para avisar que la CPU está lista para atenderlo."
      - texto: "RTI (retorno de interrupción)"
        explicacion: "RTI no es una señal sino la instrucción con la que el servicio retorna al programa interrumpido."

  - id: OP-INT-06
    tema: interrupciones
    tipo: multiple
    consigna: "¿Por qué la teoría dice que las interrupciones internas (trap) NO son estrictamente aleatorias?"
    correctas: [0]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 21–31."
    opciones:
      - texto: "Porque son señales creadas dentro del sistema en respuesta a situaciones propias del proceso en ejecución, y no están vinculadas con operaciones de E/S."
        explicacion: "Correcto. Al depender del propio proceso que corre, no aparecen en cualquier instante como sí lo hacen las externas."
      - texto: "Porque son siempre no enmascarables y por lo tanto se atienden en un orden fijo."
        explicacion: "Enmascarable o no es una clasificación independiente de si el origen es interno o externo."
      - texto: "Porque el SO define de antemano el instante en que van a ocurrir."
        explicacion: "El SO define dónde se cargan los servicios, no cuándo ocurre un trap."
      - texto: "Porque las genera el PIC siguiendo su orden de prioridades."
        explicacion: "El PIC administra pedidos externos de periféricos; los trap se originan dentro del procesador."

  - id: OP-INT-07
    tema: interrupciones
    tipo: falsa
    consigna: "Una de estas afirmaciones sobre el mecanismo de interrupción es FALSA. ¿Cuál?"
    correctas: [2]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 3–4, 8–20."
    opciones:
      - texto: "La interrupción suspende la tarea en curso, no la termina ni la aborta."
        explicacion: "Verdadera. La teoría insiste en «detener (suspender)», y la tercera acción es restablecerla en las condiciones en que estaba."
      - texto: "El procesador examina la presencia de interrupciones en cada ciclo de instrucción, en una tercera fase que se suma a captación y ejecución."
        explicacion: "Verdadera. Es la fase de gestión de interrupciones."
      - texto: "La instrucción RTI desapila el estado y además reconoce el pedido ante el controlador, por lo que reemplaza a la señal IntA."
        explicacion: "FALSA. RTI desapila exactamente lo apilado (como mínimo PC y PSW) para retomar la tarea. IntA es la señal con la que la CPU le avisa al PIC que está lista para atender, y ocurre al principio, no al final."
      - texto: "La presencia de un pedido se manifiesta mediante señales discretas (bits) llamadas banderas o flags, alojadas en un registro especial de la CPU."
        explicacion: "Verdadera. Según el estado 0 o 1 del flag se sigue uno de dos caminos."

  - id: OP-INT-08
    tema: interrupciones
    tipo: falsa
    consigna: "Sobre la identificación del origen cuando hay múltiples fuentes, ¿cuál afirmación es FALSA?"
    correctas: [1]
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 21–31."
    opciones:
      - texto: "Tener una línea física de entrada a la CPU por cada interrupción es sencillo de implementar, pero las líneas son costosas y limitan la cantidad de fuentes."
        explicacion: "Verdadera. Por eso la cantidad se acota a un número reducido, por ejemplo 3 o 4."
      - texto: "La identificación por encuesta (polling) es la más rápida de las tres, porque la CPU consulta a todos los dispositivos en una sola operación."
        explicacion: "FALSA por partida doble: la CPU consulta a los dispositivos UNO POR UNO, y precisamente por hacerse por software resulta relativamente lenta e ineficiente. La rápida es la vectorizada, que se resuelve por hardware."
      - texto: "En las interrupciones vectorizadas la CPU recibe por el bus de datos un número que identifica la fuente."
        explicacion: "Verdadera. Ese número es el vector, y lo provee el periférico o un dispositivo dedicado a generarlo."
      - texto: "El PIC se encarga, entre otras cosas, de generar el vector, administrar prioridades y habilitar interrupciones."
        explicacion: "Verdadera. Es la definición que da la teoría del controlador."

  # ============================= ENTRADA/SALIDA ==============================

  - id: OP-ES-01
    tema: entrada-salida
    tipo: multiple
    consigna: "¿Cuál es el problema central de la E/S programada con espera de respuesta?"
    correctas: [1]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 24–32."
    opciones:
      - texto: "Que la CPU no puede saber si el periférico está listo, y tiene que transferir a ciegas."
        explicacion: "Al contrario: la CPU verifica el estado leyendo un registro del módulo de interfaz, y examina el bit que lo identifica."
      - texto: "Que durante la espera la CPU permanece ociosa."
        explicacion: "Correcto. El lazo de comprobación de estado deja a la CPU sin hacer nada, y la teoría lo marca explícitamente como «no deseable»."
      - texto: "Que la CPU no interviene en la transferencia y pierde el control de la operación."
        explicacion: "Es lo contrario: en esta técnica la CPU tiene control casi directo e interviene en cada dato. El que no interviene es el DMA."
      - texto: "Que requiere un controlador dedicado que encarece el sistema."
        explicacion: "No requiere controlador dedicado. El que introduce un controlador es el DMA con el DMAC."

  - id: OP-ES-02
    tema: entrada-salida
    tipo: multiple
    consigna: "¿Qué diferencia a la E/S administrada por interrupción de la E/S programada con espera?"
    correctas: [0, 2]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 24–32."
    opciones:
      - texto: "La CPU no ejecuta el lazo de comprobación del estado del módulo."
        explicacion: "Correcto. Se saltea los pasos 1, 2 y 3 de la técnica con espera: sólo inicia la transferencia al recibir el pedido de interrupción."
      - texto: "La CPU deja de intervenir en la transferencia de cada dato."
        explicacion: "No. La CPU SIGUE interviniendo directamente en la transferencia de cada unidad de información. La que deja de intervenir es el DMA."
      - texto: "Mientras el periférico no está listo, la CPU puede seguir ejecutando otra tarea."
        explicacion: "Correcto. Es exactamente la ganancia de la técnica: la CPU no tiene que esperar."
      - texto: "Se elimina la necesidad de identificar cuál fue el dispositivo que pidió atención."
        explicacion: "Al revés: aparece el problema de identificar la fuente, y por eso la teoría desarrolla líneas separadas, polling, daisy chain y vectorizado."

  - id: OP-ES-03
    tema: entrada-salida
    tipo: multiple
    consigna: "En E/S separada de memoria (modelo Intel), ¿por qué hacen falta señales de control adicionales?"
    correctas: [0]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 20–23."
    opciones:
      - texto: "Porque el bus de direcciones es compartido por la memoria y el subsistema de E/S, y hay que identificar a cuál de los dos está accediendo la CPU."
        explicacion: "Correcto. Los espacios de direcciones son distintos, pero el bus es el mismo: la señal de control desambigua."
      - texto: "Porque las instrucciones IN y OUT no pueden direccionar más de 256 posiciones."
        explicacion: "IN/OUT admiten un número de 8 bits (0 a 255) o DX (0 a 65535), pero ese no es el motivo de las señales de control."
      - texto: "Porque los registros de E/S se comportan idéntico a una memoria de lectura/escritura."
        explicacion: "Eso es lo que pasa en la E/S memory-mapped, que es justamente la técnica opuesta."
      - texto: "Porque el subsistema de E/S necesita avisar cuándo termina cada transferencia."
        explicacion: "Ese aviso es el pedido de interrupción, que es otra cosa: pertenece a la gestión de la transferencia, no a la ubicación."

  - id: OP-ES-04
    tema: entrada-salida
    tipo: multiple
    consigna: "Según la teoría, ¿cuáles son los recursos del módulo de E/S «visibles» a la CPU y al programador?"
    correctas: [1]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 14–16."
    opciones:
      - texto: "Las líneas de datos, estado y control hacia el dispositivo externo."
        explicacion: "Ésas son la cara del módulo hacia el periférico, no lo que ve la CPU."
      - texto: "Básicamente registros: de datos, y de control y estado."
        explicacion: "Correcto. Los de datos llevan la información útil; los de control y estado configuran la transferencia y guardan las señales de estado."
      - texto: "El buffer de almacenamiento temporal y el transductor del periférico."
        explicacion: "Ésos son bloques funcionales del periférico, del otro lado del módulo."
      - texto: "La lógica de E/S que une ambas interfaces."
        explicacion: "Es interna al módulo: une la interfaz al bus con la interfaz a dispositivos externos, pero no es lo que la CPU accede."

  - id: OP-ES-05
    tema: entrada-salida
    tipo: falsa
    consigna: "Sobre puertos serie y paralelo, ¿cuál de estas afirmaciones es FALSA?"
    correctas: [3]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 17–19."
    opciones:
      - texto: "El puerto paralelo transfiere n bits simultáneamente entre el puerto y el periférico."
        explicacion: "Verdadera. Ésa es la definición de paralelo, con varias líneas de dato."
      - texto: "El puerto paralelo requiere un cable que incluya al menos los n bits de datos, lo que lo hace bastante costoso."
        explicacion: "Verdadera. Frente a eso, el serie usa un cable sencillo y de costo mucho menor."
      - texto: "En el puerto serie los datos deben serializarse, de a 1 bit por vez."
        explicacion: "Verdadera. Tiene una única línea de dato."
      - texto: "Como el serie serializa los datos, en la práctica siempre resulta más lento que el paralelo."
        explicacion: "FALSA. La teoría dice que serializar sería «EN TEORÍA» mucho más lento — el condicional está puesto a propósito. Ejemplos como Ethernet muestran que el serie no es necesariamente más lento."

  - id: OP-ES-06
    tema: entrada-salida
    tipo: falsa
    consigna: "Sobre la identificación de la fuente de interrupción en E/S, ¿cuál afirmación es FALSA?"
    correctas: [0]
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 24–32."
    opciones:
      - texto: "En la conexión en cadena (daisy chain) se necesita una línea INTR por cada módulo de E/S."
        explicacion: "FALSA. El daisy chain usa UNA SOLA línea INTR para todos; lo que se conecta encadenadamente es la línea de respuesta INTA de la CPU."
      - texto: "En el daisy chain responde el módulo que está más adelante en la conexión, colocando en el bus un vector que lo identifica."
        explicacion: "Verdadera. Los pedidos que quedan más abajo deben esperar a que termine el servicio del que respondió."
      - texto: "Usar una línea de interrupción por dispositivo es sencillo, pero limita la cantidad de dispositivos conectables."
        explicacion: "Verdadera. La limitación viene de la cantidad restringida de señales de interrupción que maneja la CPU."
      - texto: "En el esquema vectorizado, si existe un maestro del bus, sólo él puede interrumpir."
        explicacion: "Verdadera. Es una de las características que la teoría le asigna a esa estrategia."

  # ============================== MEMORIA CACHÉ ==============================

  - id: OP-CAC-01
    tema: memoria-cache
    tipo: multiple
    consigna: "¿En qué se apoya el hecho de que una caché miles de veces más chica que la MP consiga una tasa de aciertos alta?"
    correctas: [0, 3]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 28–32."
    opciones:
      - texto: "En el principio de localidad temporal: es altamente probable que lo referenciado recientemente vuelva a referenciarse en el corto tiempo."
        explicacion: "Correcto. Es uno de los 2 principios, y la teoría subraya que son de carácter empírico."
      - texto: "En que el hardware puede predecir qué direcciones va a necesitar el programa."
        explicacion: "La teoría no plantea predicción de direcciones para justificar la caché: se apoya en el comportamiento observado de los programas."
      - texto: "En que la tasa de aciertos es proporcional al tamaño de la caché."
        explicacion: "La teoría dice exactamente lo contrario: la tasa de aciertos NO tiene por qué ser proporcional al tamaño."
      - texto: "En el principio de localidad espacial: es altamente probable que los próximos elementos referenciados estén en las proximidades de los últimos."
        explicacion: "Correcto. Es el segundo principio, y es el que justifica traer un BLOQUE completo y no sólo la palabra pedida."

  - id: OP-CAC-02
    tema: memoria-cache
    tipo: multiple
    consigna: "¿Cuántos campos tiene la dirección de memoria en la correspondencia totalmente asociativa, y cuáles?"
    correctas: [0]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 42–55."
    opciones:
      - texto: "2 campos: tag (número de bloque en MP) y word (palabra dentro del bloque)."
        explicacion: "Correcto. Como el bloque puede ir a cualquier línea, no hace falta un campo que fije la posición."
      - texto: "3 campos: tag (número de grupo), line (bloque dentro del grupo) y word."
        explicacion: "Ésos son los campos de la correspondencia DIRECTA, donde el bloque tiene una línea fija."
      - texto: "3 campos: tag/grupo, conjunto y palabra."
        explicacion: "Ésos son los campos de la correspondencia ASOCIATIVA POR CONJUNTOS."
      - texto: "1 campo: sólo el tag, porque la palabra se resuelve por hardware asociativo."
        explicacion: "El campo word siempre hace falta para ubicar la palabra dentro del bloque."

  - id: OP-CAC-03
    tema: memoria-cache
    tipo: multiple
    consigna: "¿Por qué en la correspondencia directa no hay política de reemplazo?"
    correctas: [1]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 56–60."
    opciones:
      - texto: "Porque en la directa nunca se producen fallos que obliguen a traer un bloque nuevo."
        explicacion: "Sí se producen fallos, y de hecho la teoría advierte que pueden ser muchísimos si dos bloques caen en la misma línea."
      - texto: "Porque la asignación es fija: hay una sola línea posible para cada bloque, así que indefectiblemente se reemplaza el que está en esa ranura."
        explicacion: "Correcto. No hay elección que hacer, entonces no hay algoritmo que elegir."
      - texto: "Porque el reemplazo lo resuelve el software, y no el hardware de la caché."
        explicacion: "Todos los algoritmos de reemplazo deben implementarse en hardware, por razones de velocidad."
      - texto: "Porque la directa usa siempre LRU por definición."
        explicacion: "LRU es uno de los algoritmos para las asignaciones asociativa y asociativa por conjuntos, no para la directa."

  - id: OP-CAC-04
    tema: memoria-cache
    tipo: multiple
    consigna: "¿Cuál es el inconveniente de la política de escritura write-back?"
    correctas: [2]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 61–64."
    opciones:
      - texto: "Que aumenta el tráfico con la memoria principal."
        explicacion: "Ése es el inconveniente de write-through, que actualiza caché y MP simultáneamente."
      - texto: "Que puede provocar retrasos durante múltiples escrituras."
        explicacion: "También es de write-through, por el mismo motivo: cada escritura va a memoria."
      - texto: "Que la MP puede contener información errónea en algún momento, porque sólo se actualiza cuando se reemplaza el bloque."
        explicacion: "Correcto. Ése es exactamente el riesgo de coherencia de write-back, y es lo que se vuelve grave con DMA o con múltiples CPU con cachés individuales."
      - texto: "Que obliga a usar no-write allocate en los fallos."
        explicacion: "Al revés: write-back se combina habitualmente con write allocate. No-write allocate se combina con write-through."

  - id: OP-CAC-05
    tema: memoria-cache
    tipo: multiple
    consigna: "Sobre qué parámetros hay que trabajar para mejorar el tiempo de acceso medio, según t_CPU = (1 − TF) × t_accesoMC + TF × PF"
    correctas: [0, 1, 3]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 28–32."
    opciones:
      - texto: "El tiempo de acceso a la caché (t_accesoMC)."
        explicacion: "Correcto. La teoría dice textualmente que hay que reducir t_accesoMC, TF y PF."
      - texto: "La tasa de fallos (TF)."
        explicacion: "Correcto. Se ataca con el tamaño del bloque, la política de asignación y la separación de caché de instrucciones y datos."
      - texto: "La cantidad de instrucciones del programa (nI)."
        explicacion: "No es un parámetro del tiempo de acceso medio a memoria: no aparece en la fórmula."
      - texto: "La penalización por fallo (PF)."
        explicacion: "Correcto. Depende de la latencia de la MP y del ancho de banda, que a su vez depende de la velocidad del bus."

  - id: OP-CAC-06
    tema: memoria-cache
    tipo: falsa
    consigna: "Sobre el tamaño del bloque de caché, ¿cuál de estas afirmaciones es FALSA?"
    correctas: [3]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 41."
    opciones:
      - texto: "Al aumentar el tamaño del bloque mejora la tasa de aciertos, pero sólo hasta cierto tamaño."
        explicacion: "Verdadera. Después de ese punto, aumentarlo no mejora."
      - texto: "Con bloques más grandes entran menos bloques de la MP en la caché, lo que tiende a aumentar la tasa de fallos."
        explicacion: "Verdadera. Es la contracara del beneficio por localidad espacial."
      - texto: "Un bloque más grande aumenta la penalización por fallo, porque son más palabras a transferir entre MP y caché."
        explicacion: "Verdadera, y por eso la teoría concluye que existe un valor óptimo."
      - texto: "Como el efecto neto siempre es favorable, conviene elegir el bloque más grande que permita el presupuesto."
        explicacion: "FALSA. La teoría es explícita: existe un valor óptimo, justamente porque los efectos van en sentidos opuestos."

  - id: OP-CAC-07
    tema: memoria-cache
    tipo: falsa
    consigna: "Sobre las 3 correspondencias, ¿cuál de estas afirmaciones es FALSA?"
    correctas: [1]
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 42–55."
    opciones:
      - texto: "La totalmente asociativa requiere una memoria asociativa (CAM) para implementar el directorio, y resulta compleja y costosa."
        explicacion: "Verdadera. El precio de comparar el tag simultáneamente con todas las etiquetas."
      - texto: "La correspondencia directa da siempre mejor rendimiento que la asociativa, porque no necesita buscar en todo el directorio."
        explicacion: "FALSA. La teoría califica su rendimiento de «aceptable, aunque a veces puede ser malo»: si el programa accede repetidamente a dos bloques que caen en la misma línea, los desaciertos son muy grandes."
      - texto: "En la directa, el número de línea de la caché sale del número de bloque referenciado «en módulo» la cantidad de líneas."
        explicacion: "Verdadera. Por eso la asignación es fija y no hay política de reemplazo."
      - texto: "La asociativa por conjuntos combina lo mejor de las otras dos correspondencias."
        explicacion: "Verdadera. Es la conclusión con la que cierra la teoría."

