diagramas:

  - id: DG-01
    tema: interrupciones
    consigna: "¿Cuál de estos esquemas muestra el ciclo de instrucción con la fase de gestión de interrupciones?"
    correcta: 0
    opciones: [{svg: ciclo-instruccion-interrupcion}, {svg: tecnicas-es}, {svg: cauce-nanomips}]
    explicacion: "Es el ciclo con las 3 fases: captación, ejecución y la fase de gestión de interrupciones que examina el flag en cada vuelta. Los otros dos son las técnicas de gestión de E/S y el cauce segmentado del nanoMIPS."
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 22–23, 25."

  - id: DG-02
    tema: interrupciones
    consigna: "Te piden esquematizar la estructura interna de un controlador programable de interrupciones. ¿Cuál es?"
    correcta: 1
    opciones: [{svg: modulo-es}, {svg: pic}, {svg: von-neumann}]
    explicacion: "El del PIC es el que muestra IRR, ISR e IMR con el diálogo IntR/IntA hacia la CPU. El primero es la estructura interna del módulo de E/S —se parece, porque también son registros— y el tercero es von Neumann."
    fuente: "Teorías/02 Arq clase2 Interrupciones.pdf, fil. 33, 35, 43."

  - id: DG-03
    tema: entrada-salida
    consigna: "¿Cuál muestra la estructura interna del módulo de E/S, con la interfaz al bus y la interfaz a dispositivos externos?"
    correcta: 2
    opciones: [{svg: pic}, {svg: buses-jerarquia}, {svg: modulo-es}]
    explicacion: "El del módulo de E/S es el que tiene las dos caras unidas por la lógica de E/S, con los registros de datos y de control y estado en el medio."
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 12."

  - id: DG-04
    tema: entrada-salida
    consigna: "¿Cuál compara las 3 técnicas de gestión de la transferencia de E/S?"
    correcta: 1
    opciones: [{svg: jerarquia-memoria}, {svg: tecnicas-es}, {svg: ejecucion-superescalar}]
    explicacion: "Es el que pone en paralelo E/S programada con espera, administrada por interrupción y DMA. Ojo con el reflejo de buscar algo horizontal: en el sitio está apilado en vertical para que se lea en el celular."
    fuente: "Teorías/03 Arq clase3 EntradaSalida.pdf, fil. 24–28, 44."

  - id: DG-05
    tema: memoria-cache
    consigna: "¿Cuál es la jerarquía de memoria?"
    correcta: 0
    opciones: [{svg: jerarquia-memoria}, {svg: buses-jerarquia}, {svg: taxonomia-flynn}]
    explicacion: "La pirámide de niveles por velocidad, capacidad y costo. El segundo es la jerarquía de BUSES, que es otra cosa aunque comparta la palabra."
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 8, 11."

  - id: DG-06
    tema: memoria-cache
    consigna: "¿Cuál muestra las 3 correspondencias entre memoria principal y caché?"
    correcta: 2
    opciones: [{svg: jerarquia-memoria}, {svg: maquinas-n-direcciones}, {svg: correspondencias-cache}]
    explicacion: "Es el que despliega directa, totalmente asociativa y asociativa por conjuntos con los campos de la dirección en cada caso."
    fuente: "Teorías/07 Arq clase7 Memoria.pdf, fil. 43, 44–45, 48–49, 52–53."

  - id: DG-07
    tema: segmentacion
    consigna: "¿Cuál es el cauce de 5 etapas del nanoMIPS con sus riesgos?"
    correcta: 1
    opciones: [{svg: ejecucion-superescalar}, {svg: cauce-nanomips}, {svg: ciclo-instruccion-interrupcion}]
    explicacion: "El del nanoMIPS es el de las 5 etapas con los 3 tipos de riesgo marcados. El primero es la ejecución superescalar, que también tiene etapas pero llega hasta el commit."
    fuente: "Teorías/04 Arq clase4 Segmentación de cauce.pdf, fil. 46, 49, 52, 54, 59, 61, 64–66."

  - id: DG-08
    tema: superescalares
    consigna: "¿Cuál es el modelo de ejecución superescalar?"
    correcta: 0
    opciones: [{svg: ejecucion-superescalar}, {svg: cauce-nanomips}, {svg: tecnicas-es}]
    explicacion: "Es el que va de la captación al commit mostrando la emisión y finalización, y compara segmentada, supersegmentada y superescalar."
    fuente: "Teorías/08 Arq clase8 Procesadores Superescalares.pdf, fil. 44 (+ fil. 9, 10, 12, 18)."

  - id: DG-09
    tema: paralelismo
    consigna: "¿Cuál es la taxonomía de Flynn con SMP, NUMA y cluster?"
    correcta: 2
    opciones: [{svg: jerarquia-memoria}, {svg: buses-jerarquia}, {svg: taxonomia-flynn}]
    explicacion: "El de Flynn abre en SISD, SIMD, MISD y MIMD, y dentro de MIMD separa memoria compartida (SMP, NUMA) de memoria distribuida (cluster)."
    fuente: "Teorías/09 Arq clase9 Procesamiento paralelo.pdf, fil. 6 (+ fil. 7, 9, 12, 15, 16)."

  - id: DG-10
    tema: buses
    consigna: "¿Cuál muestra la interconexión mediante un bus y la jerarquía de buses?"
    correcta: 1
    opciones: [{svg: von-neumann}, {svg: buses-jerarquia}, {svg: jerarquia-memoria}]
    explicacion: "Es el que va del bus único a la arquitectura tradicional y a la de altas prestaciones. Cuidado con von Neumann: también dibuja buses, pero para mostrar los 3 subsistemas."
    fuente: "7 anexo clase 07 sobre_buses.pdf, fil. 11, 14, 38."

  - id: DG-11
    tema: von-neumann-y-pila
