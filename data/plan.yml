# =============================================================================
# PLAN DE ESTUDIO — 4 semanas
# =============================================================================
# Genera docs/plan.md con scripts/gen_plan.py.
#
# -----------------------------------------------------------------------------
# LAS FECHAS SON RELATIVAS: se calculan restando días a `meta.final`
# -----------------------------------------------------------------------------
# La versión anterior tenía fechas absolutas y quedó vencida en cuanto se movió
# la mesa. Ahora cada bloque declara `desde` y `hasta` en DÍAS ANTES DEL FINAL,
# y el generador resuelve el calendario. Para reprogramar todo el plan alcanza
# con cambiar `meta.final`.
#
# gen_plan.py aborta si `meta.final` ya pasó.
#
# -----------------------------------------------------------------------------
# QUÉ ES DATO Y QUÉ ES CRITERIO
# -----------------------------------------------------------------------------
# El REPARTO de temas sale de la tabla de frecuencia de banco-finales.yml, que
# cuenta apariciones reales en los finales relevados: lo más tomado va primero.
# Las HORAS son criterio, estimadas sobre el tamaño de cada ficha más el tiempo
# de escribir a mano y corregir.
# =============================================================================

meta:
  # ⚠️ CONFIRMAR con la fecha real de la mesa de septiembre.
  # Es el único lugar donde se toca el calendario: todo lo demás se recalcula.
  final: "2026-09-16"
  hora: "10:00"
  aula: "5"
  fecha_confirmada: false
  horas_por_dia: "2 a 3 h"
  horas_finde: "4 a 5 h"

# La rutina que se repite en CADA tema. El orden importa: las preguntas van
# ANTES que la ficha, y la teoría al final y sólo como parche.
rutina:
  - paso: "Leé los enunciados reales del tema en el banco"
    minutos: 5
    detalle: >-
      No para contestarlos: para saber qué te van a pedir. Vas a leer distinto
      sabiendo que el enunciado dice «esquematice la estructura interna del PIC».
  - paso: "Leé la ficha, parando en cada «Comprobación rápida»"
    minutos: 40
    detalle: >-
      Los checkpoints están puestos justo donde se pierde el concepto. Si fallás
      uno, releé esa sección antes de seguir: es más barato ahí que en la hoja.
  - paso: "Armá la respuesta con los chips"
    minutos: 10
    detalle: >-
      En «¿Qué no puede faltar?», filtrado por el tema. Sirve para fijar qué
      conceptos entran antes de tener que producirlos de memoria.
  - paso: "Cerrá todo y escribí UNA respuesta a mano"
    minutos: 25
    detalle: >-
      Sin material, sin buscar nada, cronometrado. Éste es el paso que cuenta y
      es el primero que se cae cuando falta tiempo. Defendelo.
  - paso: "Corregite con la rúbrica"
    minutos: 10
    detalle: >-
      Tildá punto por punto lo que sí escribiste. Lo que quedó sin tildar es tu
      lista de repaso, y casi nunca es lo que esperabas.
  - paso: "Quiz y afirmaciones falsas del tema"
    minutos: 10
    detalle: "Para pescar lo que no sabías que no sabías."

# Lo que se hace TODOS los días, aparte del bloque de la semana.
diario:
  - titulo: "Fichas de recuperación activa"
    minutos: 15
    detalle: >-
      De los temas ya vistos, no del de hoy. Es lo que evita que lo de la semana
      1 se borre para la semana 4.
    enlace: "practica/fichas/"
  - titulo: "Una partida de Contrarreloj"
    minutos: 5
    detalle: >-
      Opcional, para los días en que cuesta arrancar. Mirá qué tema te queda en
      rojo en el panel de dominio.
    enlace: "practica/juego/"

bloques:

  - id: S1
    desde: 28
    hasta: 22
    titulo: "Semana 1 — Los cuatro más tomados"
    porque: >-
      Caché, interrupciones, E/S y DMA suman casi la mitad del banco. Van
      primero porque son los que más veces vas a necesitar y porque así tienen
      tres semanas para decantar. Un tema por día, con dos días de aire.
    temas: [memoria-cache, interrupciones, entrada-salida, dma]
    metas:
      - "Los 4 temas leídos con TODOS sus checkpoints contestados bien."
      - "4 respuestas completas escritas a mano, una por tema, cronometradas."
      - "El esquema del PIC y la estructura del módulo de E/S dibujados de memoria."
      - "Quiz de los 4 temas al 100 %."
    aviso: >-
      No arranques por el simulacro. Esta semana es para construir material
      propio: cada respuesta escrita a mano es la que vas a repasar en la
      semana 4.

  - id: S2
    desde: 21
    hasta: 15
    titulo: "Semana 2 — El bloque del cauce"
    porque: >-
      Segmentación, sus soluciones y superescalares son un solo hilo: los
      riesgos no se entienden sin las soluciones, y el superescalar es la
      evolución de los dos. Es el bloque más pesado del programa y conviene
      darle una semana entera.
    temas: [segmentacion, soluciones-segmentacion, superescalares]
    metas:
      - "El cauce de 5 etapas dibujado de memoria con los 3 riesgos marcados."
      - "3 respuestas a mano: los riesgos, las soluciones y las políticas de emisión."
      - "Poder explicar en voz alta de dónde sale el dato en el forwarding LW→SW."
      - "Las secuencias de estos temas ordenadas sin errores."
    aviso: >-
      El punto que más se pierde: la segmentación NO acelera cada instrucción,
      mejora el throughput. Si no lo escribís con esas palabras, lo perdés.

  - id: S3
    desde: 14
    hasta: 8
    titulo: "Semana 3 — Los que faltan y el primer simulacro"
    porque: >-
      Paralelismo, buses, RISC y von Neumann completan el programa. Son cuatro
      temas pero tres tienen fichas cortas. A mitad de semana entra el primer
      simulacro completo: con los 11 temas vistos, es el momento de descubrir
      si el problema va a ser de tiempo.
    temas: [paralelismo, buses, risc-cisc, von-neumann-y-pila]
    extra:
      - titulo: "Primer simulacro completo, 3 horas, a mano"
        detalle: >-
          Elegí uno del banco. No importa el puntaje: importa si llegás a
          contestar los 5 puntos. Corregilo con las rúbricas y anotá los huecos.
        enlace: "practica/simulacro/"
    metas:
      - "Los 11 temas con al menos una respuesta escrita a mano."
      - "Primer simulacro entregado dentro de las 3 horas y corregido."
      - "Lista escrita de los huecos que dejó el simulacro."
    aviso: >-
      Von Neumann y pila es el tema más flojo del sitio: no existe la clase 1 en
      las fuentes y pila y pasaje de parámetros salen de resúmenes de alumnos.
      Es el único donde vale la pena abrir Stallings, capítulos 3, 10 y 11.

  - id: S4
    desde: 7
    hasta: 1
    titulo: "Semana 4 — Sólo simulacros y errores"
    porque: >-
      Nada nuevo. Esta semana se comprueba que podés escribir 5 puntos en 3
      horas, que es lo que realmente se evalúa. Dos simulacros más, y el resto
      del tiempo repasando SOLAMENTE lo que falló.
    temas: []
    extra:
      - titulo: "Dos simulacros completos más, en días distintos"
        detalle: >-
          A mano, con reloj, sin material. Usá finales que no hayas hecho.
        enlace: "practica/simulacro/"
      - titulo: "Repaso dirigido por errores"
        detalle: >-
          Sólo los puntos que las rúbricas dejaron sin tildar. No abras un tema
          que salió bien: a esta altura eso es ansiedad disfrazada de estudio.
      - titulo: "Una vuelta completa de fichas de recuperación activa"
        detalle: >-
          Los 44 enunciados del banco, de memoria. Es el repaso más eficiente
          que hay a esta altura.
        enlace: "practica/fichas/"
    metas:
      - "3 simulacros completos hechos en total, los 5 puntos contestados."
      - "Hoja única con los errores recurrentes."
      - "Las 44 fichas en el cajón «la sabía»."
    aviso: >-
      El día anterior: cerrá la carpeta temprano. Dormir bien rinde más que la
      última hora de repaso.

# Qué NO hacer. En un mes se pueden cometer errores que en una semana no.
no_hacer:
  - "No releas las teorías completas. Son 12 PDFs de ~50 filminas. Las fichas ya son esa condensación con la cita al pie; la teoría se abre sólo para el punto que falló."
  - "No dejes «escribir a mano» para la última semana. Es el error que hunde este plan: entendés leyendo y no podés redactar."
  - "No estudies los TODOs como si fueran tuyos. SCSI, temporización asíncrona, Core i7 y el ejemplo numérico de DMA no están en las fuentes de cátedra: si caen, se contesta lo que sí está y se aclara el límite."
  - "No confundas el juego con estudiar. Contrarreloj y el quiz entrenan reconocer; el examen te pide producir. Sirven de entrada en calor, no de reemplazo."
  - "No hagas los 3 simulacros la misma semana que leés temas nuevos. Se pisan y ninguno rinde."
  - "No arranques un tema nuevo en la semana 4."
