name: Build & Deploy

on:
  push:
    branches: [main]
  # Permite disparar el build a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; si se pushea de nuevo, se cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Sin esto un paso colgado se queda horas y el deploy nunca falla ni
    # publica: quedás mirando un run "in_progress" que no avanza. Ya pasó
    # con apt-get, que se colgó 55 min instalando graphviz.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Java (para PlantUML)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # PlantUML necesita Graphviz (dot) para todo lo que no sea un diagrama
      # de secuencia o de actividad. Sin esto NO falla: genera un SVG con el
      # mensaje "Cannot find Graphviz" dibujado adentro, que se publica como
      # si fuera el diagrama. Ya pasó una vez con 12 de los 13.
      - name: Instalar Graphviz
        # apt-get puede colgarse esperando un lock o un mirror que no responde.
        # Con timeout falla rápido, y un reintento cubre el caso transitorio.
        timeout-minutes: 5
        run: |
          for intento in 1 2 3; do
            echo "== intento $intento =="
            sudo apt-get update -qq && sudo apt-get install -y -qq graphviz && break
            echo "falló, reintentando en 10 s"
            sleep 10
          done
          dot -V

      - name: Cachear el jar de PlantUML
        uses: actions/cache@v4
        with:
          path: plantuml.jar
          key: plantuml-1.2026.6

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Pre-renderizado: los .svg se generan acá, el sitio publicado no
      # consulta ningún servidor PlantUML en runtime.
      - name: Renderizar diagramas PlantUML a SVG
        run: bash scripts/render_puml.sh

      - name: Build del sitio
        run: mkdocs build --strict

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
