" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="49.7554" x="189.2854" y="176.393">(SRAM)</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="189.8263" x="136.44" y="196.8232">RAM de muy alta velocidad</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="146.686" x="136.44" y="217.2533">1's - 10's ns &#183; KB - MB</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="81.0756" x="136.44" y="237.6835">Administra:</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="90.1356" x="221.4156" y="237.6835">el hardware</text></g><!--entity MP--><g class="entity" data-qualified-name="MP" data-source-line="11" id="ent0003"><rect fill="#E1BEE7" height="101.7206" rx="3" ry="3" style="stroke:#546E7A;stroke-width:0.5;" width="312.952" x="74.88" y="274.0779"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="137.5209" x="84.88" y="300.113">Memoria principal</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="52.4704" x="230.201" y="300.113">(DRAM)</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="154.9811" x="84.88" y="320.5432">RAM de alta velocidad</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="125.1309" x="84.88" y="340.9733">100's ns &#183; MB - GB</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="292.952" x