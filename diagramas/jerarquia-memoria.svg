amily="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="134.1471" x="20.268" y="640.517">Optimizar velocidad:</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="202.0332" x="157.7951" y="640.517">pr&#243;xima a la del nivel m&#225;s r&#225;pido</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="4.888" x="12" y="658.223">&#8226;</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="157.0791" x="20.268" y="658.223">Minimizar el costo total:</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="180.2321" x="180.7271" y="658.223">cercano al del nivel m&#225;s lento</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="3.38" x="12" y="675.929">&#160;</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="196.9111" x="12" y="693.635">Propiedades que debe cumplir</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="4.888" x="12" y="711.341">&#8226;</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="63.505" x="20.268" y="711.341">Inclusi&#243;n:</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="317.9673" x="87.153" y="711.341">los datos de un nivel est&#225;n tambi&#233;n en los inferiores</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="4.888" x="12" y="729.047">&#8226;</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="76.8821" x="20.268" y="729.047">Coherencia:</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="341.1853" x="100.5301" y="729.047">las copias en distintos niveles tienen los mismos valores</text></g><!--link REG to CACHE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk6"><path d="M231.36,128.6579 C231.36,135.6579 231.36,138.0179 231.36,145.2479" fill="none" id="REG-to-CACHE" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="231.36,150.2479,235.36,141.2479,231.36,145.2479,227.36,141.2479,231.36,150.2479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CACHE to MP--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M231.36,252.4279 C231.36,259.5079 231.36,261.7779 231.36,268.8479" fill="none" id="CACHE-to-MP" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="231.36,273.8479,235.36,264.8479,231.36,268.8479,227.36,264.8479,231.36,273.8479" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link MP to DISCO--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="17" id="lnk8"><path d="M231.36,376.1479 C231.36,383.3179 231.36,385.6079 231.36,392.5379" fill="none" id="MP-to-DISCO" style="stroke:#37474F;stroke-width:1;"/><polygon fill="#37474F" points="231.36,397.5379,235.36,388.5379,231.36,392.5379,227.36,388.5379,231.36,397.5379" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link DISCO to CINTA--><g class="l