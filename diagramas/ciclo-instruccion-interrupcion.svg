" y="499.816">&#8226; todos los registros</text><rect fill="#E8EAF6" height="81.2904" rx="3" ry="3" style="stroke:#3F51B5;stroke-width:0.5;" width="216.4263" x="272.7589" y="427.5678"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="196.4263" x="282.7589" y="453.6029">Salvar el estado del proceso</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="33.9152" x="282.7589" y="474.0331">en la</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="117.0908" x="320.5742" y="474.0331">pila del sistema</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="142.366" x="282.7589" y="494.4632">(al menos PC y PSW)</text><rect fill="#E8EAF6" height="81.2904" rx="3" ry="3" style="stroke:#3F51B5;stroke-width:0.5;" width="264.3517" x="248.7962" y="528.8582"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="149.971" x="258.7962" y="554.8933">Buscar el vector en el</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="244.3517" x="258.7962" y="575.3235">&#225;rea de vectores de interrupci&#243;n</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="130.4559" x="258.7962" y="595.7536">y cargarlo en el PC</text><rect fill="#E8EAF6" height="60.8603" rx="3" ry="3" style="stroke:#3F51B5;stroke-width:0.5;" width="150.7709" x="305.5866" y="630.1487"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="130.7709" x="315.5866" y="656.1838">Ejecutar el servicio</text><text fil