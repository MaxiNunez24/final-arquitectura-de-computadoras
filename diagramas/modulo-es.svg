="459.1" y="359.5432">Informaci&#243;n &#250;til recibida desde,</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="198.4513" x="459.1" y="379.9733">o transmitida a, el perif&#233;rico</text></g><!--entity RC--><g class="entity" data-qualified-name="MOD.RC" data-source-line="16" id="ent0004"><rect fill="#C5CAE9" height="122.1507" rx="3" ry="3" style="stroke:#546E7A;stroke-width:0.5;" width="284.6317" x="152.68" y="292.6479"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="215.2065" x="162.68" y="318.683">Registros de estado / control</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="235.7416" x="162.68" y="339.1132">Controlan las caracter&#237;sticas de la</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="264.6317" x="162.68" y="359.5433">transferencia y almacenan se&#241;ales de</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="187.1863" x="162.68" y="379.9735">estado de la comunicaci&#243;n</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="131.3259" x="162.68" y="400.4036">(falla, no listo, etc.)</text></g><!--entity LOG--><g class="entity" data-qualified-name="MOD.LOG" data-source-line="17" id="ent0005"><rect fill="#ECEFF1" height="40.4301" rx="3" ry="3" style="stroke:#546E7A;stroke-width:0.5;" width="117.6207" x="23.19" y="333.5079"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="97.6207" x="33.19" y="359.543">L&#243;gica de E/S</text></g><!--entity LIE--><g class="entity" data-qualified-name