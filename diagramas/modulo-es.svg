0" lengthAdjust="spacing" textLength="128.7909" x="367.27" y="648.703">L&#243;gica de control</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="243.4517" x="367.27" y="669.1332">Secci&#243;n de control y estado: recibe</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="217.2764" x="367.27" y="689.5633">y genera las se&#241;ales de control</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="156.391" x="367.27" y="709.9935">y estado del perif&#233;rico</text></g><!--entity BUS--><g class="entity" data-qualified-name="BUS" data-source-line="12" id="ent0001"><rect fill="#FFF8E1" height="142.5809" rx="3" ry="3" style="stroke:#546E7A;stroke-width:0.5;" width="248.3165" x="201.84" y="47.0679"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="228.3165" x="211.84" y="73.103">INTERFAZ AL BUS DEL SISTEMA</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="3.9" x="211.84" y="93.5332">&#160;</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="91.0056" x="211.84" y="113.9633">Bus de datos</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="134.9109" x="211.84" y="134.3935">L&#237;neas de direcci&#243;n</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="120.6458" x="211.84" y="154.8236">L&#237;neas de control</text><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" lengthAdjust="spacing" textLength="3.9" x="211.84" y="175.2537">&#160;</text></g><!--entity EXT--><g class="entity" data-qualified-name="EXT" data-source-line="26" id="ent0010"><rect fill="#FFF8E1" height="40.4301" rx="3" ry="3" style="stroke:#546E7A;stroke-width:0.5;" width="133.6258" x="147.19" y="768.3879"/><text fill="#1A237E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="15" font-weight="700" lengthAdjust="spacing" textLength="113.6258" x="157.19" y="794.423">Datos externos</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="39" id="ent0021"><path d="M724.53,325.1679 L724.53,382.286 A3,3 0 0 0 727.53,385.286 L908.4751,385.286 A3,3 0 0 0 911.4751,382.286 L911.4751,332.1679 L901.4751,322.1679 L727.53,322.1679 A3,3 0 0 0 724.53,325.1679" fill="#FFF8E1" style="stroke:#FFB300;stroke-width:0.5;"/><path d="M901.4751,322.1679 L901.4751,330.6679 A1.5,1.5 0 0 0 902.9751,332.1679 L911.4751,332.1679 L901.4751,322.1679" fill="#FFF8E1" style="stroke:#FFB300;stroke-width:1;"/><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="165.9451" x="730.53" y="341.0649">Recursos visibles a la CPU</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="143.3901" x="730.53" y="358.7709">(y al programador): son</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" lengthAdjust="spacing" textLength="77.9481" x="730.53" y="376.477">b&#225;sicamente</text><text fill="#4E342E" font-family="'Inter, Helvetica, Arial, sans-serif'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="58.292" x="811.8581" y="376.477">registros</text></g><g class="entity" data-qualified-name="GMN23" data-source-line="45" id="ent0024"><path d="M90.19,834.8179 L90.19,1086.7021 A3,3 0 0 0 93.19,1089.7021 L334.8192,1089.7021 A3,3 0 0 0 337.8192,1086.7021 L337.8192,841.8179 L327.8192,831.8179 L218,831.8179 L214,809.1179 L210